{% extends "account/base_dash.html" %}
{% block content %}
<div class="modal-overlay open">
  <div class="modal">
    <div class="modal-title">Confirmar exclusão</div>
    <div class="modal-sub">Tem certeza que deseja excluir {{ tipo }} <strong>{{ objeto }}</strong>? Esta ação não pode ser desfeita.</div>
    <form method="post">
      {% csrf_token %}
      <div class="modal-actions">
        {% if voltar_url %}
        <a class="btn" href="{{ voltar_url }}">Cancelar</a>
        {% elif tipo == 'livro' %}
        <a class="btn" href="{% url 'livros' %}">Cancelar</a>
        {% else %}
        <a class="btn" href="{% url 'equipamentos' %}">Cancelar</a>
        {% endif %}
        <button type="submit" class="btn btn-danger">Excluir</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
