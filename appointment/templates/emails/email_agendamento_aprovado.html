<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento aprovado</title>
</head>
<body style="margin:0;padding:0;background:#f4f7f6;font-family:Arial,sans-serif;">
  <table align="center" cellpadding="0" cellspacing="0" width="100%" style="max-width:600px;background:#ffffff;margin-top:20px;border-radius:8px;overflow:hidden;">
    <tr>
      <td style="padding:24px;background:#28a745;color:#ffffff;text-align:center;">
        <h1 style="margin:0;font-size:26px;">EngineLab UFC</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:32px;">
        <h2 style="margin-top:0;color:#28a745;">Agendamento aprovado</h2>
        <p>Olá, {{ agendamento.usuario.first_name }}.</p>
        <p>Seu agendamento no setor <strong>{{ agendamento.setor.nome }}</strong> foi aprovado:</p>
        <ul>
          <li><strong>Data:</strong> {{ agendamento.data|date:"d/m/Y" }}</li>
          <li><strong>Horário:</strong> {{ agendamento.hora_inicio|time:"H:i" }} às {{ agendamento.hora_fim|time:"H:i" }}</li>
        </ul>
      </td>
    </tr>
  </table>
</body>
</html>
