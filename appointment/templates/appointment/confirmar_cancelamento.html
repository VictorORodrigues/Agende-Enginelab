{% extends "account/base_dash.html" %}
{% block content %}
<div class="page-header">
  <div><div class="page-title">Cancelar Agendamento</div></div>
  <a class="btn" href="{% url 'appointment:meus_agendamentos' %}">Voltar</a>
</div>

<div class="card" style="max-width: 500px">
    <p>Deseja realmente cancelar seu agendamento no setor <strong>{{ agendamento.setor.nome }}</strong> para o dia <strong>{{ agendamento.data|date:"d/m/Y" }}</strong>?</p>

    <form method="post" style="margin-top: 24px">
        {% csrf_token %}
        <div style="display:flex; gap:12px">
            <a href="{% url 'appointment:meus_agendamentos' %}" class="btn" style="flex:1; justify-content: center">Não, manter</a>
            <button type="submit" class="btn btn-danger" style="flex:1; justify-content: center">Sim, cancelar</button>
        </div>
    </form>
</div>
{% endblock %}
