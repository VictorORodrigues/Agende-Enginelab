<div class="row g-3 mb-3">
  <div class="col-12 col-lg-8">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start gap-3">
          <div>
            <h5 class="card-title mb-1">Olá, {{ perfil.matricula|default:request.user.username }}</h5>
            <div class="text-muted">Perfil: {{ perfil.get_tipo_display }}</div>
            <div class="text-muted">Status: {{ perfil.get_status_display }}</div>
          </div>
          <a class="btn btn-outline-danger btn-sm" href="{% url 'logout' %}">Sair</a>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12 col-lg-4">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title mb-2">Atalhos</h6>
        <div class="d-grid gap-2">
          <a class="btn btn-outline-primary btn-sm" href="{% url 'password_reset' %}">Redefinir senha</a>
        </div>
      </div>
    </div>
  </div>
</div>
