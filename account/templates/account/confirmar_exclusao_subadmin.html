{% extends "account/base_dash.html" %}
{% block content %}
<div class="modal-overlay open">
  <div class="modal">
    <div class="modal-title">Confirmar exclusão</div>
    <div class="modal-sub">Tem certeza que deseja excluir o SubAdmin <strong>{{ subadmin.user.get_full_name|default:subadmin.user.username }}</strong>? Esta ação não pode ser desfeita.</div>
    <form method="post">
      {% csrf_token %}
      <div class="modal-actions">
        <a class="btn" href="{% url 'admin_subadmins' %}">Cancelar</a>
        <button type="submit" class="btn btn-danger">Excluir</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
