{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EngineLab UFC{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'account/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'account/css/auth.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* Ajuste para o ícone do olho ficar dentro do input */
    .password-wrapper {
      position: relative !important;
      display: block !important;
      width: 100% !important;
    }
    .password-wrapper .form-input {
      padding-right: 40px !important;
    }
    .password-toggle {
      position: absolute !important;
      right: 12px !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      cursor: pointer !important;
      color: #6b7280 !important; /* var(--text2) */
      z-index: 10 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      height: 100% !important;
    }
    .password-toggle:hover {
      color: #1a4fd6 !important; /* var(--brand) */
    }
  </style>
</head>
<body>
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}"
           style="position:fixed;top:16px;right:16px;z-index:200;min-width:280px;max-width:400px;box-shadow:0 4px 12px rgba(0,0,0,.12)">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}

  <script>
    function togglePassword(inputId, toggleIcon) {
      const input = document.getElementById(inputId);
      const icon = toggleIcon.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    }
  </script>
</body>
</html>
