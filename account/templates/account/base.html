{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EngineLab UFC{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'enginelab/img/favicon-32.png' %}">
  <link rel="stylesheet" href="{% static 'account/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'account/css/auth.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* Ajuste para o ícone do olho ficar dentro do input */
    .password-wrapper {
      position: relative !important;
      display: block !important;
      width: 100% !important;
    }
    .password-wrapper .form-input {
      padding-right: 40px !important;
    }
    .password-toggle {
      position: absolute !important;
      right: 12px !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      cursor: pointer !important;
      color: #6b7280 !important; /* var(--text2) */
      z-index: 10 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      height: 100% !important;
    }
    .password-toggle:hover {
      color: #5cb680 !important; /* var(--brand) */
    }
  </style>
</head>
<body>
  {% if messages %}
    <div class="toast-container" id="toastContainer">
      {% for message in messages %}
        <div class="toast toast-{{ message.tags|default:'info' }}">
          <span class="toast-icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M8 5v4M8 11h.01"/></svg>
          </span>
          <div class="toast-body">{{ message }}</div>
          <button type="button" class="toast-close" onclick="fecharToast(this)" aria-label="Fechar">&times;</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}

  <script>
    function fecharToast(btn) {
      const toast = btn.closest('.toast');
      toast.classList.add('toast-leaving');
      toast.addEventListener('animationend', () => toast.remove(), { once: true });
    }
    document.querySelectorAll('.toast').forEach(function (toast) {
      setTimeout(function () {
        if (toast.isConnected) {
          toast.classList.add('toast-leaving');
          toast.addEventListener('animationend', () => toast.remove(), { once: true });
        }
      }, 6000);
    });

    function togglePassword(inputId, toggleIcon) {
      const input = document.getElementById(inputId);
      const icon = toggleIcon.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    }
  </script>
</body>
</html>
