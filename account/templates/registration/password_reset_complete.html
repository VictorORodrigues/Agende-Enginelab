{% extends "account/base.html" %}
{% block title %}Senha Atualizada - EngineLab UFC{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card" style="text-align: center;">
    <div class="status-icon" style="background: var(--success-bg); color: var(--success);">
        <i class="bi bi-check-circle"></i>
    </div>
    <div class="auth-title">Senha atualizada</div>
    <div class="auth-sub">
      Sua senha foi redefinida com sucesso. Você já pode entrar na sua conta.
    </div>

    <div style="margin-top: 24px;">
      <a href="{% url 'login' %}" class="btn btn-primary" style="width:100%;justify-content:center">
        Entrar
      </a>
    </div>
  </div>
</div>
{% endblock %}
