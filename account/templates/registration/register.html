{% extends "account/base.html" %}
{% load widget_tweaks %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Cadastro EngineLab</h4>
        </div>
        <div class="card-body">
          <form method="post" novalidate>
            {% csrf_token %}
            
            {% for field in form %}
              <div class="mb-3">
                <label class="form-label fw-bold">{{ field.label }}</label>
                {{ field|add_class:"form-control" }}
                {% for error in field.errors %}
                  <div class="text-danger small">{{ error }}</div>
                {% endfor %}
              </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  // Agora o ID do campo é id_matricula
  const matriculaInput = document.getElementById("id_matricula");

  if (matriculaInput) {
    matriculaInput.addEventListener("keypress", function (e) {
      if (!/[0-9]/.test(e.key)) e.preventDefault();
    });
    matriculaInput.setAttribute("inputmode", "numeric");
  }
});
</script>
{% endblock %}
