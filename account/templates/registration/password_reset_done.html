{% extends "account/base.html" %}
{% block title %}Verifique seu e-mail - EngineLab UFC{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card" style="text-align: center;">
    <div class="status-icon" style="background: var(--info-bg); color: var(--info);">
        <i class="bi bi-envelope-check"></i>
    </div>
    <div class="auth-title">Verifique seu e-mail</div>
    <div class="auth-sub">
      Se existir uma conta com esse e-mail, você receberá um link para redefinir a senha.
    </div>

    <div class="auth-footer" style="margin-top: 24px;">
      <a class="auth-link" href="{% url 'login' %}">Voltar ao login</a>
    </div>
  </div>
</div>
{% endblock %}
