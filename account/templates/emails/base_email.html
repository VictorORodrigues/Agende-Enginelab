<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{% block titulo %}EngineLab UFC{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#eef0f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef0f2" style="background-color:#eef0f2;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.08);border:1px solid #e5e7eb;">
          <tr>
            <td align="center" bgcolor="{{ header_cor|default:'#5cb680' }}" style="padding:28px 24px;background-color:{{ header_cor|default:'#5cb680' }};">
              <div style="font-size:22px;font-weight:700;color:#ffffff;letter-spacing:-0.01em;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                EngineLab <span style="font-weight:400;opacity:.85;">UFC</span>
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px;color:#4a4a4a;font-size:15px;line-height:1.6;">
              {% block conteudo %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 24px;background-color:#f9fafb;border-top:1px solid #e5e7eb;text-align:center;">
              <p style="margin:0;color:#9aa1ac;font-size:12px;">Este é um e-mail automático. Por favor, não responda.</p>
              <p style="margin:6px 0 0 0;color:#9aa1ac;font-size:12px;">&copy; 2026 EngineLab UFC. Todos os direitos reservados.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
